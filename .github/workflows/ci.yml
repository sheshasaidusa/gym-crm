name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # The same suite on Postgres, the database production runs (SQLite hides dialect bugs).
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gym -d gym_test" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://gym:gym@localhost:5432/gym_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q

  # The typed API client must match the backend. Run the "Regenerate API types" workflow
  # (or `npm run gen:api` locally) when this fails.
  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: uv run python scripts/export_openapi.py ../frontend/openapi.json
        working-directory: backend
      - run: npx openapi-typescript openapi.json -o src/lib/api/schema.d.ts
        working-directory: frontend
      - name: Fail if the committed types are stale
        run: git diff --exit-code -- frontend/openapi.json frontend/src/lib/api/schema.d.ts

  # Tests use SQLite; this checks the migrations against the database production runs.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gym -d gym_crm" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gym:gym@localhost:5432/gym_crm
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Upgrade from empty
        run: uv run alembic upgrade head
      - name: Models match migrations
        run: uv run alembic check
      - name: Downgrade and upgrade again
        run: uv run alembic downgrade base && uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
