name: Regenerate API types

# Regenerates frontend/openapi.json and src/lib/api/schema.d.ts from the backend and commits
# them to the chosen branch. For machines that can't run Python locally.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update
        required: true

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: uv run python scripts/export_openapi.py ../frontend/openapi.json
        working-directory: backend
      - run: npx openapi-typescript openapi.json -o src/lib/api/schema.d.ts
        working-directory: frontend
      - name: Commit if changed
        run: |
          if git diff --quiet -- frontend/openapi.json frontend/src/lib/api/schema.d.ts; then
            echo "Types already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add frontend/openapi.json frontend/src/lib/api/schema.d.ts
          git commit -m "Regenerate API types"
          git push
