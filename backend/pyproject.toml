[project]
name = "gym-crm-api"
version = "0.1.0"
description = "Gym CRM backend API"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.106",
    "celery[redis]>=5.6.3",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sentry-sdk[celery,fastapi]>=2.71.0",
    "sqlalchemy[asyncio]>=2.0",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
